name: Restricted plugin verification

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Local-independent npm: or github: source"
        required: true
        type: string
      allow_execute:
        description: Explicitly import target code in this disposable runner
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone public repository without a token
        run: git clone --depth 1 https://github.com/${{ github.repository }}.git .
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Static inspection
        env:
          DSH_TRUST_SOURCE: ${{ inputs.source }}
        run: |
          case "$DSH_TRUST_SOURCE" in
            npm:*|github:*) ;;
            *) echo "source must use npm: or github:" >&2; exit 1 ;;
          esac
          set +e
          node dist/cli.js inspect "$DSH_TRUST_SOURCE" --format json --output passport.json
          code=$?
          set -e
          case "$code" in
            0) exit 0 ;;
            2) exit 0 ;;
            3) exit 3 ;;
            *) exit "$code" ;;
          esac
      - name: Pin the inspected immutable source
        run: |
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("passport.json", "utf8")); process.stdout.write(`DSH_TRUST_RESOLVED=${p.subject.resolved}\n`)' >> "$GITHUB_ENV"
      - name: Explicit dynamic import
        if: ${{ inputs.allow_execute == true }}
        run: node dist/cli.js verify-import "$DSH_TRUST_RESOLVED" --output dynamic-evidence.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plugin-verification-evidence
          path: |
            passport.json
            dynamic-evidence.json
          if-no-files-found: ignore
          retention-days: 14
